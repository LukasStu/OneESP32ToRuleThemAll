esphome:
  name: esp
  friendly_name: ESP
  min_version: 2024.11.0
  name_add_mac_suffix: false
  platformio_options:
    build_flags:
      - "-std=gnu++17"
    build_unflags:
      - "-std=gnu++11"
      - "-fno-rtti"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:
  level: INFO

# Enable Home Assistant API
api:
    encryption:
      key: !secret api_encryption_key

# Allow Over-The-Air updates
ota:
  platform: esphome
  password: !secret ota_password


wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.178.44
    gateway: 192.168.178.1
    subnet: 255.255.255.0


time:
  - platform: homeassistant
    id: homeassistant_time

substitutions:
  interval_very_fast: 15s
  interval_fast: 30s
  interval_medium: 60s
  interval_slow: 5min
  interval_very_slow: 15min
  interval_once_in_a_while: 1h

#########################################
#                                       #
#   SPI configuration                   #
#                                       #
#########################################
spi:
  id: McpSpi
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

#########################################
#                                       #
#   CAN configuration                   #
#                                       #
#########################################
canbus:
  - id: !extend wp_can
    platform: mcp2515
    spi_id: McpSpi
    cs_pin: GPIO5
    bit_rate: 20kbps

#########################################
#                                       #
#   Packages                            #
#                                       #
#########################################
packages:
 wpl13acs_classic: !include OneESP32ToRuleThemAll/yaml/wpl13acs_classic.yaml
